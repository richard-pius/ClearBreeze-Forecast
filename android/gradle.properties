# Gradle daemon JVM sizing.
# Kept modest on purpose: -Xmx8G with a 4G metaspace asks the JVM to reserve
# ~12G before the daemon starts, which fails outright on a machine without
# that much free RAM ("Unable to establish loopback connection"). 4G is
# comfortably more than this module needs.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError

# Independent modules compile concurrently.
org.gradle.parallel=true

# NOTE: Do not enable `org.gradle.caching` or `kotlin.incremental` here.
# This project lives on D: while the Dart pub cache lives on C:, and Kotlin's
# relocatable path converter computes plugin source paths *relative to* the
# project root. Windows cannot express a relative path across drive letters,
# so both flags make every plugin module fail with:
#   IllegalArgumentException: this and base files have different roots
# Re-enable only if the project and PUB_CACHE end up on the same drive.
kotlin.incremental=false

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
